name: Publish privacy and deletion pages
on:
  push:
    branches: [flutter-app]
    paths:
      - 'docs/**'
      - '.github/workflows/publish-legal-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: legal-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/flutter-app'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate required pages
        run: |
          test -s docs/privacy.html
          test -s docs/delete-account.html
          test -s docs/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy public pages
        id: deployment
        uses: actions/deploy-pages@v4
