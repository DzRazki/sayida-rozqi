name: Build Android APK and Source ZIP

on:
  push:
    branches:
      - main
      - master
      - design-banner-update
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Download project
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare banner and launcher icons
        run: |
          python3 -m pip install Pillow==11.3.0
          python3 tools/prepare_brand.py
      - name: Package complete project
        run: zip -r Sayida-Rozqi-Source.zip . -x '.git/*' '.gradle/*' '*/build/*' '*.zip'
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Sayida-Rozqi-Complete-Source
          path: Sayida-Rozqi-Source.zip
          if-no-files-found: error
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sayida-Rozqi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
