name: Build signed Google Play bundle
on:
  workflow_dispatch:
  push:
    branches: [flutter-app]
    paths:
      - '.github/workflows/build-play-bundle.yml'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'tools/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release inputs and version
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name}" || { echo "::error::Missing $name"; exit 1; }
          done
          python - <<'PY'
          import os, re
          from pathlib import Path
          match = re.search(r'^version:\s*[^\n+]+\+(\d+)\s*$', Path('pubspec.yaml').read_text(), re.M)
          if not match or not 0 < int(match.group(1)) <= 2100000000:
              raise SystemExit('Invalid build number in pubspec.yaml')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'VERSION_CODE={match.group(1)}\n')
          PY
      - name: Create Android platform
        run: flutter create . --platforms=android --org dz.sayida --project-name sayida_rozqi
      - name: Configure release signing and API level
        run: python tools/configure_play_signing.py
      - name: Align file_picker JVM targets
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/file-picker-jvm.gradle" <<'GRADLE'
          gradle.beforeProject { p ->
              if (p.name == 'file_picker') {
                  p.afterEvaluate {
                      p.tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach { t ->
                          t.sourceCompatibility = '11'
                          t.targetCompatibility = '11'
                      }
                      p.tasks.configureEach { t ->
                          if (t.name.startsWith('compile') && t.name.endsWith('Kotlin') && t.hasProperty('kotlinOptions')) {
                              t.kotlinOptions.jvmTarget = '11'
                          }
                      }
                  }
              }
          }
          GRADLE
      - name: Generate icons
        run: |
          python -m pip install 'Pillow==11.3.0'
          python tools/generate_brand_icons.py
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build release bundle
        run: flutter build appbundle --release --build-number "$VERSION_CODE"
      - name: Verify bundle signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p play-output
          cp build/app/outputs/bundle/release/app-release.aab play-output/sayida-rozqi.aab
          jarsigner -verify -verbose -certs play-output/sayida-rozqi.aab > play-output/signature-verification.txt
          keytool -printcert -jarfile play-output/sayida-rozqi.aab > play-output/signing-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sayida-rozqi-play-${{ env.VERSION_CODE }}
          path: play-output/
          retention-days: 7
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/sayida-play-upload.jks"
