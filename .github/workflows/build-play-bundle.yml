name: Build signed Google Play bundle
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Unique integer greater than all previously uploaded version codes'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name}" || { echo "::error::Missing $name"; exit 1; }
          done
          python -c 'import os; v=os.environ["VERSION_CODE"]; assert v.isascii() and v.isdigit() and 0 < int(v) <= 2100000000, "Invalid version code"'
      - name: Create Android platform
        run: flutter create . --platforms=android --org dz.sayida --project-name sayida_rozqi
      - name: Configure release signing
        run: python tools/configure_play_signing.py
      - name: Generate icons
        run: |
          python -m pip install 'Pillow==11.3.0'
          python tools/generate_brand_icons.py
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build release bundle
        run: flutter build appbundle --release --build-number "$VERSION_CODE"
      - name: Verify bundle signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p play-output
          cp build/app/outputs/bundle/release/app-release.aab play-output/sayida-rozqi.aab
          jarsigner -verify -verbose -certs play-output/sayida-rozqi.aab > play-output/signature-verification.txt
          keytool -printcert -jarfile play-output/sayida-rozqi.aab > play-output/signing-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sayida-rozqi-play-${{ inputs.version_code }}
          path: play-output/
          retention-days: 7
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/sayida-play-upload.jks"
