name: Build Flutter APK

on:
  push:
    branches: [flutter-app, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android platform
        run: flutter create . --platforms=android --org dz.sayida --project-name sayida_rozqi

      - name: Set up Python for launcher icons
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate branded launcher icons
        run: |
          python -m pip install 'Pillow==11.3.0'
          python tools/generate_brand_icons.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Print debug APK SHA-1
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          keytool -printcert -jarfile "$APK" | tee sha1.txt
          echo "=================================================="
          echo "COPY THIS SHA-1 FOR GOOGLE ANDROID OAUTH CLIENT:"
          grep 'SHA1:' sha1.txt
          echo "=================================================="

      - name: Rename APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-debug.apk release/sayida-rozqi.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sayida-rozqi-flutter-apk
          path: release/sayida-rozqi.apk

      - name: Delete previous release
        run: |
          gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish APK to GitHub Releases
        run: |
          gh release create latest release/sayida-rozqi.apk --title "تطبيق السيدة رزقي" --notes "حمّلي ملف sayida-rozqi.apk مباشرة وثبّتيه على هاتفك."
        env:
          GH_TOKEN: ${{ github.token }}
