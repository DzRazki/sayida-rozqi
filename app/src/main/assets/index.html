<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>السيدة رزقي</title>
<style>
:root{--brown:#3b2118;--gold:#e5b563;--cream:#fbf5e9;--card:#fffdf8;--muted:#806d5d;--line:#eadbc6}
*{box-sizing:border-box}body{margin:0;padding-bottom:86px;background:var(--cream);color:var(--brown);font-family:Tahoma,Arial,sans-serif}button,input,textarea,select{font:inherit}img{max-width:100%}
.top{position:relative;min-height:210px;display:flex;align-items:flex-end;overflow:hidden;background:linear-gradient(120deg,#704223,#28170f);color:#fff4dc}.top img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.top .shade{position:relative;z-index:1;width:100%;padding:70px 18px 18px;background:linear-gradient(0deg,rgba(36,18,9,.88),rgba(36,18,9,.15))}.top h1{margin:0;font-size:30px;color:var(--gold)}.top p{margin:6px 0 0;font-size:13px;color:#f4e3c4}
main{max-width:900px;margin:auto;padding:16px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}.section-title{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}.section-title h2{margin:0;font-size:19px}
button,.button{display:inline-block;border:0;border-radius:12px;padding:12px 14px;background:var(--brown);color:var(--cream);cursor:pointer;text-decoration:none;text-align:center}.button.gold{background:var(--gold);color:var(--brown);font-weight:bold}.button.outline{background:transparent;border:1px solid var(--brown);color:var(--brown)}button:disabled{opacity:.5}
input,textarea,select{display:block;width:100%;padding:13px;margin:8px 0 14px;border:1px solid var(--line);border-radius:12px;background:#fffdf8;color:var(--brown)}textarea{min-height:110px}label{display:block;font-weight:bold;margin-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px}.chips button{white-space:nowrap;background:#eadac0;color:var(--brown);font-size:13px}.chips .chosen{background:var(--brown);color:var(--gold)}
.featured{position:relative;overflow:hidden;border-radius:20px;min-height:230px;display:flex;align-items:flex-end;background:linear-gradient(120deg,#704223,#28170f);color:#fff4dc}.featured img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.featured .info{position:relative;z-index:1;padding:18px;background:linear-gradient(0deg,rgba(36,18,9,.9),transparent)}.featured h3{margin:0 0 6px;font-size:22px;color:var(--gold)}.featured p{margin:0 0 12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--card)}.art{height:130px;background:linear-gradient(140deg,#e8c797,#9b663e);display:flex;align-items:center;justify-content:center;font-size:48px}.art img{width:100%;height:100%;object-fit:cover}.card .body{padding:11px}.card h3{margin:0 0 5px;font-size:15px}.small{color:var(--muted);font-size:12px;line-height:1.8}.heart{position:absolute;top:8px;left:8px;z-index:2;padding:8px 10px;background:#fff8e7;color:#873b30}
.detail-art{height:250px;border-radius:18px;overflow:hidden;background:linear-gradient(140deg,#e8c797,#9b663e);display:flex;align-items:center;justify-content:center;font-size:60px}.detail-art img{width:100%;height:100%;object-fit:cover}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}ul,ol{padding-right:20px;line-height:2}.video{width:100%;aspect-ratio:16/9;border:0;border-radius:14px}
nav{position:fixed;bottom:0;right:0;left:0;display:flex;background:var(--brown);padding:8px 4px;z-index:20}nav button{flex:1;background:transparent;color:var(--gold);font-size:12px;padding:9px 2px}nav .active{background:var(--gold);color:var(--brown);border-radius:12px}.toast{position:fixed;bottom:92px;right:16px;left:16px;background:var(--brown);color:#fff;padding:14px;border-radius:14px;text-align:center;z-index:30}.error{background:#ffe8e3;color:#8a2424;padding:13px;border-radius:12px;white-space:pre-wrap}.badge{display:inline-block;background:#eadac0;color:var(--brown);border-radius:8px;padding:3px 8px;font-size:11px}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header class="top"><img src="banner.jpg" alt="السيدة رزقي"><div class="shade"><h1>السيدة رزقي</h1><p>وصفات جزائرية أصيلة · من المطبخ إلى قلب البيت</p></div></header>
<main id="main"></main>
<nav id="nav"></nav>
<script>
'use strict';
const SUPABASE_URL='https://vyiywiteeqkyuroqftkn.supabase.co';
const SUPABASE_KEY='sb_publishable_4kzJ5yc7xLUPXBYoe2V0iQ_YyKEDiDp';
const ADMIN_UID='e33bc325-89f7-49ab-afdb-17794b06fc7d';
const CHANNEL='https://www.youtube.com/@chef4razki';
const NL=String.fromCharCode(10);let recipes=[],page='home',selected=null,category='الكل',query='',loading=false,loadError='',session=null,editId=null,refreshPromise=null;
let favorites=[];try{favorites=JSON.parse(localStorage.getItem('rozqi-cloud-favorites'))||[]}catch(e){}if(!Array.isArray(favorites))favorites=[];
const $=s=>document.querySelector(s);const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const b=document.createElement('div');b.className='toast';b.textContent=m;document.body.appendChild(b);setTimeout(()=>b.remove(),3000)}
function saveFav(){try{localStorage.setItem('rozqi-cloud-favorites',JSON.stringify(favorites))}catch(e){toast('تعذر حفظ المفضلة')}}
function https(v){if(!v)return '';try{const u=new URL(v);return u.protocol==='https:'&&!u.username&&!u.password?u.href:''}catch(e){return ''}}
function yt(v){const clean=https(v);if(!clean)return '';try{const u=new URL(clean);return ['youtube.com','www.youtube.com','m.youtube.com','youtu.be'].includes(u.hostname.toLowerCase())?clean:''}catch(e){return ''}}
function videoId(v){const clean=yt(v);if(!clean)return '';const u=new URL(clean),p=u.pathname.split('/').filter(Boolean);let id='';if(u.hostname==='youtu.be')id=p[0]||'';else if(u.pathname==='/watch')id=u.searchParams.get('v')||'';else if(['embed','shorts','live'].includes(p[0]))id=p[1]||'';return /^[A-Za-z0-9_-]{11}$/.test(id)?id:''}
async function raw(path,o={}){const c=new AbortController();const t=setTimeout(()=>c.abort(),25000);try{const r=await fetch(SUPABASE_URL+path,{method:o.method||'GET',headers:Object.assign({apikey:SUPABASE_KEY,'Content-Type':'application/json'},o.headers||{}),body:o.body===undefined?undefined:JSON.stringify(o.body),signal:c.signal});const text=await r.text();let d=null;if(text)try{d=JSON.parse(text)}catch(e){d={message:text}}if(!r.ok)throw Object.assign(new Error((d&&(d.msg||d.message||d.error_description||d.error))||('فشل الطلب: '+r.status)),{status:r.status});return d}catch(e){if(e.name==='AbortError')throw new Error('انتهت مهلة الاتصال');throw e}finally{clearTimeout(t)}}
function setSession(d){session={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:d.expires_at||Math.floor(Date.now()/1000)+d.expires_in,user:d.user||(session&&session.user)}}
async function refresh(){if(!session||refreshPromise)return;const token=session.refresh_token;refreshPromise=raw('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:token}}).then(d=>setSession(d)).catch(e=>{if(e.status===400||e.status===401)session=null;throw e}).finally(()=>refreshPromise=null);return refreshPromise}
async function api(path,o={}){if(session&&session.expires_at<=Math.floor(Date.now()/1000)+60)await refresh();const send=()=>raw(path,{method:o.method,body:o.body,headers:Object.assign({},o.headers||{},session?{Authorization:'Bearer '+session.access_token}:{})});try{return await send()}catch(e){if(e.status===401&&session){await refresh();return send()}throw e}}
const admin=()=>!!(session&&session.user&&session.user.id===ADMIN_UID);
function nav(){const items=[['home','⌂ الرئيسية'],['favorites','♡ المفضلة'],['channel','▶ القناة'],['admin','⚙ الإدارة']];$('#nav').innerHTML=items.map(x=>`<button data-go='${x[0]}' class='${page===x[0]?'active':''}'>${x[1]}</button>`).join('')}
function art(r,big){const img=https(r.image_url);return `<div class='${big?'detail-art':'art'}'>${img?`<img src='${esc(img)}' alt='${esc(r.name)}' loading='lazy' referrerpolicy='no-referrer'>`:esc(r.emoji||'🍽️')}</div>`}
function cards(list){if(!list.length)return '<p class="small">لا توجد وصفات هنا بعد.</p>';return `<div class='grid'>`+list.map(r=>`<article class='card'><button class='heart' data-heart='${esc(r.id)}'>${favorites.includes(r.id)?'♥':'♡'}</button><div data-open='${esc(r.id)}' role='button' tabindex='0'>${art(r)}<div class='body'><h3>${esc(r.name)}</h3><p class='small'>${esc(r.time)} دقيقة · ${esc(r.servings)} أشخاص</p></div></div></article>`).join('')+`</div>`}
function home(){const published=recipes.filter(r=>r.published);const cats=['الكل'];published.forEach(r=>{if(!cats.includes(r.category))cats.push(r.category)});const featured=published.find(r=>r.featured)||published[0];const list=published.filter(r=>(category==='الكل'||r.category===category)&&r.name.includes(query));$('#main').innerHTML=`${featured?`<section class='featured'>${featured.image_url?`<img src='${esc(https(featured.image_url))}' alt=''>`:''}<div class='info'><small>وصفة اليوم</small><h3>${esc(featured.name)}</h3><p>${esc(featured.description||'نكهة الأصالة في كل لقمة')}</p><button class='button gold' data-open='${esc(featured.id)}'>عرض الوصفة</button></div></section>`:''}<div class='section-title'><h2>الوصفات</h2><button data-reload='1' ${loading?'disabled':''}>${loading?'تحميل...':'↻ تحديث'}</button></div><input id='search' placeholder='ابحثي عن وصفة...' value='${esc(query)}'><div class='chips'>${cats.map(c=>`<button data-cat='${esc(c)}' class='${category===c?'chosen':''}'>${esc(c)}</button>`).join('')}</div><section id='results'>${cards(list)}</section>`;$('#search').oninput=e=>{query=e.target.value.trim();const l=published.filter(r=>(category==='الكل'||r.category===category)&&r.name.includes(query));$('#results').innerHTML=cards(l)}}
function favoritesPage(){const list=recipes.filter(r=>r.published&&favorites.includes(r.id));$('#main').innerHTML=`<div class='section-title'><h2>المفضلة</h2></div>${cards(list)}`}
function channel(){const vids=recipes.filter(r=>r.published&&videoId(r.youtube_url));$('#main').innerHTML=`<section class='panel'><h2>قناة السيدة رزقي</h2><p class='small'>تابعي فيديوهات الوصفات وطريقة التحضير خطوة بخطوة.</p><div class='row'><a class='button gold' href='${CHANNEL}?sub_confirmation=1'>اشتراك</a><a class='button outline' href='${CHANNEL}'>زيارة القناة</a></div></section>${vids.length?vids.map(r=>`<section class='panel'><h3>${esc(r.name)}</h3><iframe class='video' src='https://www.youtube.com/embed/${videoId(r.youtube_url)}?playsinline=1' allowfullscreen loading='lazy'></iframe></section>`).join(''):'<p class="small">لا توجد فيديوهات منشورة بعد.</p>'}`}
function detail(){const r=recipes.find(x=>x.id===selected);if(!r){go('home');return}const id=videoId(r.youtube_url);$('#main').innerHTML=`<button data-go='home'>← الرئيسية</button><section class='panel'>${art(r,true)}<h2>${esc(r.name)}</h2><p class='small'>${esc(r.category)} · ${esc(r.time)} دقيقة · ${esc(r.servings)} أشخاص</p><p style='white-space:pre-wrap'>${esc(r.description)}</p><div class='row'><button data-heart='${esc(r.id)}'>${favorites.includes(r.id)?'♥ محفوظة':'♡ حفظ'}</button>${id?`<a class='button' href='${esc(yt(r.youtube_url))}'>فتح في يوتيوب</a>`:''}</div></section><section class='panel'><h3>المكونات</h3><ul>${(r.ingredients||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><section class='panel'><h3>طريقة التحضير</h3><ol>${(r.steps||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></section>${id?`<section class='panel'><h3>فيديو التحضير</h3><iframe class='video' src='https://www.youtube.com/embed/${id}?playsinline=1' allowfullscreen loading='lazy'></iframe></section>`:''}`}
function login(){ $('#main').innerHTML=`<section class='panel'><h2>دخول الإدارة</h2><form id='lf'><label>البريد الإلكتروني<input name='email' type='email' required dir='ltr'></label><label>كلمة المرور<input name='password' type='password' required></label><button>تسجيل الدخول</button><p id='err' class='error' hidden></p></form></section>`;$('#lf').onsubmit=async e=>{e.preventDefault();const f=e.target,b=f.querySelector('button'),err=$('#err');b.disabled=true;err.hidden=true;try{const d=await raw('/auth/v1/token?grant_type=password',{method:'POST',body:{email:f.email.value.trim(),password:f.password.value}});setSession(d);if(!admin()){const t=session.access_token;session=null;raw('/auth/v1/logout',{method:'POST',headers:{Authorization:'Bearer '+t}}).catch(()=>{});throw new Error('هذا الحساب غير مخوّل بإدارة الوصفات.')}toast('تم تسجيل الدخول');await load()}catch(ex){err.textContent=ex.message;err.hidden=false}finally{b.disabled=false}}}
function adminPage(){if(!admin()){login();return}$('#main').innerHTML=`<section class='panel'><h2>إدارة الوصفات</h2><p class='small'>${esc(session.user.email)} · ${recipes.length} وصفة</p><div class='row'><button data-new='1'>+ وصفة جديدة</button><button data-reload='1'>تحديث</button><button id='out'>خروج</button></div></section><section class='panel'>${recipes.length?recipes.map(r=>`<div style='margin-bottom:16px'><h3>${esc(r.name)}</h3><p><span class='badge'>${r.published?'منشورة':'مسودة'}</span> ${r.featured?'<span class=badge>مميزة</span>':''}</p><div class='row'><button data-open='${esc(r.id)}'>عرض</button><button data-edit='${esc(r.id)}'>تعديل</button><button data-del='${esc(r.id)}'>حذف</button></div></div>`).join(''):'<p class="small">لا توجد وصفات.</p>'}</section>`;$('#out').onclick=async()=>{const old=session;session=null;recipes=[];go('home');if(old)try{await raw('/auth/v1/logout',{method:'POST',headers:{Authorization:'Bearer '+old.access_token}})}catch(e){};await load()}}
function editor(id){if(!admin()){go('admin');return}editId=id;const r=recipes.find(x=>x.id===id)||{name:'',category:'أطباق تقليدية',description:'',emoji:'🍽️',image_url:'',youtube_url:'',time:30,servings:4,ingredients:[],steps:[],featured:false,published:false};$('#main').innerHTML=`<section class='panel'><h2>${id?'تعديل الوصفة':'وصفة جديدة'}</h2><form id='rf'><label>اسم الوصفة<input name='name' required value='${esc(r.name)}'></label><label>التصنيف<input name='category' required value='${esc(r.category)}'></label><label>الوصف<textarea name='description'>${esc(r.description)}</textarea></label><label>رابط صورة الطبق<input name='image_url' type='url' dir='ltr' value='${esc(r.image_url)}'></label><label>رابط يوتيوب<input name='youtube_url' type='url' dir='ltr' value='${esc(r.youtube_url)}'></label><label>المدة بالدقائق<input name='time' type='number' min='1' required value='${esc(r.time)}'></label><label>عدد الأشخاص<input name='servings' type='number' min='1' required value='${esc(r.servings)}'></label><label>المكونات<textarea name='ingredients' required>${esc((r.ingredients||[]).join(NL))}</textarea></label><label>الخطوات<textarea name='steps' required>${esc((r.steps||[]).join(NL))}</textarea></label><label><input name='featured' type='checkbox' ${r.featured?'checked':''}> وصفة مميزة</label><label><input name='published' type='checkbox' ${r.published?'checked':''}> نشر الوصفة</label><p id='ferr' class='error' hidden></p><div class='row'><button>حفظ</button><button type='button' data-go='admin'>إلغاء</button></div></form></section>`;$('#rf').onsubmit=save}
async function save(e){e.preventDefault();const f=e.target,b=f.querySelector('button'),err=$('#ferr');const val=n=>f.elements[n].value.trim();const lines=n=>val(n).split(NL).map(x=>x.trim()).filter(Boolean);const data={name:val('name'),category:val('category'),description:val('description'),emoji:'🍽️',image_url:https(val('image_url')),youtube_url:yt(val('youtube_url')),time:+val('time'),servings:+val('servings'),ingredients:lines('ingredients'),steps:lines('steps'),featured:f.featured.checked,published:f.published.checked};err.hidden=true;try{if(!data.name||!data.category)throw new Error('أدخلي الاسم والتصنيف');if(!data.ingredients.length||!data.steps.length)throw new Error('أضيفي المكونات والخطوات');b.disabled=true;b.textContent='جارٍ الحفظ...';const path=editId?'/rest/v1/recipes?id=eq.'+encodeURIComponent(editId):'/rest/v1/recipes';const saved=await api(path,{method:editId?'PATCH':'POST',headers:{Prefer:'return=representation'},body:data});if(!Array.isArray(saved)||saved.length!==1)throw new Error('لم يتم الحفظ');const row=saved[0],i=recipes.findIndex(x=>x.id===row.id);if(i>=0)recipes[i]=row;else recipes.unshift(row);go('admin');toast('تم الحفظ')}catch(ex){err.textContent=ex.message;err.hidden=false}finally{b.disabled=false;b.textContent='حفظ'}}
async function remove(id){if(!admin()||!confirm('حذف الوصفة نهائيًا؟'))return;try{await api('/rest/v1/recipes?id=eq.'+encodeURIComponent(id),{method:'DELETE'});recipes=recipes.filter(r=>r.id!==id);favorites=favorites.filter(x=>x!==id);saveFav();render();toast('تم الحذف')}catch(e){toast(e.message)}}
async function load(){if(loading)return;loading=true;loadError='';render();try{let p='/rest/v1/recipes?select=*&order=featured.desc,created_at.desc&limit=500';if(!admin())p+='&published=eq.true';const d=await api(p);if(!Array.isArray(d))throw new Error('استجابة غير متوقعة');recipes=d}catch(e){loadError=e.message}finally{loading=false;render()}}
function go(p){page=p;category='الكل';query='';render();scrollTo(0,0)}
function render(){nav();if(loadError)$('#main').innerHTML=`<p class='error'>${esc(loadError)}</p>`;else if(page==='home')home();else if(page==='favorites')favoritesPage();else if(page==='channel')channel();else if(page==='admin')adminPage();else if(page==='detail')detail()}
window.appBack=()=>{if(page==='detail'||page==='favorites'||page==='channel')go('home');else if(page==='edit')go('admin');else toast('للخروج استخدمي زر الشاشة الرئيسية')};
document.addEventListener('click',e=>{const b=e.target.closest('button,a,[data-open]');if(!b||b.disabled)return;const d=b.dataset;if(d.go){if(b.tagName==='A')return;go(d.go)}else if(d.open){selected=d.open;page='detail';render();scrollTo(0,0)}else if(d.heart){const id=d.heart;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):favorites.concat(id);saveFav();if(page==='home'||page==='favorites')render();else b.textContent=favorites.includes(id)?'♥ محفوظة':'♡ حفظ'}else if(d.cat){category=d.cat;render()}else if(d.reload)load();else if(d.new)editor(null);else if(d.edit)editor(d.edit);else if(d.del)remove(d.del)});
document.addEventListener('error',e=>{if(e.target.tagName==='IMG'){const p=e.target.parentElement;e.target.remove();if(p.classList.contains('art')||p.classList.contains('detail-art'))p.textContent='🍽️'}},true);
render();load();
</script>
</body>
</html>
