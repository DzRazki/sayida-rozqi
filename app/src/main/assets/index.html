<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>السيدة رزقي</title>

<style>
:root {
  --brown: #3b2118;
  --gold: #e5b563;
  --cream: #fbf5e9;
  --muted: #806d5d;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding-bottom: 90px;
  background: var(--cream);
  color: var(--brown);
  font-family: Tahoma, Arial, sans-serif;
}

header {
  padding: 22px 15px;
  background: var(--brown);
  color: var(--gold);
  text-align: center;
}

header h1 { margin: 8px 0; font-size: 28px; }
header p { color: #ebd8b9; font-size: 12px; }

main {
  max-width: 850px;
  margin: auto;
  padding: 16px;
}

button, input, textarea, select { font: inherit; }

button, .button {
  display: inline-block;
  border: 0;
  border-radius: 12px;
  padding: 12px;
  background: var(--brown);
  color: var(--cream);
  cursor: pointer;
  text-decoration: none;
  text-align: center;
}

button:disabled { opacity: .5; cursor: wait; }

input, textarea {
  display: block;
  width: 100%;
  padding: 13px;
  margin: 8px 0 15px;
  border: 1px solid #ddceb7;
  border-radius: 12px;
  background: #fffdf8;
  color: var(--brown);
}

textarea { min-height: 115px; }
label { display: block; line-height: 1.9; }

input[type="checkbox"] {
  display: inline-block;
  width: auto;
  margin: 8px;
}

nav {
  position: fixed;
  bottom: 0;
  right: 0;
  left: 0;
  display: flex;
  gap: 3px;
  padding: 9px 4px;
  background: var(--brown);
  z-index: 5;
}

nav button {
  flex: 1;
  padding: 11px 2px;
  font-size: 12px;
  color: var(--gold);
}

nav .active {
  background: var(--gold);
  color: var(--brown);
}

.hero {
  padding: 22px;
  margin-bottom: 18px;
  border-radius: 20px;
  background: linear-gradient(120deg, #704223, #28170f);
  color: #fff4dc;
}

.hero h2 { color: var(--gold); }

.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 8px 0 15px;
}

.chips button {
  white-space: nowrap;
  background: #eadac0;
  color: var(--brown);
  font-size: 12px;
}

.chips .chosen {
  background: var(--brown);
  color: var(--gold);
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.card {
  position: relative;
  overflow: hidden;
  border: 1px solid #eadbc6;
  border-radius: 18px;
  background: #fffdf8;
}

.art {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 150px;
  background: linear-gradient(140deg, #e8c797, #9b663e);
  font-size: 60px;
}

.art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.detail-art { height: 250px; }
.info { padding: 12px; }
.info h3 { margin: 0 0 8px; font-size: 15px; }

.small {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.9;
}

.heart {
  position: absolute;
  top: 8px;
  left: 8px;
  padding: 8px 11px;
  background: #fff8e7;
  color: #873b30;
}

.panel {
  padding: 17px;
  margin: 14px 0;
  border: 1px solid #eadbc6;
  border-radius: 18px;
  background: #fffdf8;
}

.row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.row > button, .row > .button { flex: 1; }

li { margin: 8px 0; line-height: 2; }

.empty {
  padding: 30px 10px;
  text-align: center;
  color: var(--muted);
  line-height: 2;
}

.error {
  padding: 15px;
  border-radius: 12px;
  background: #ffe8e3;
  color: #8a2424;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 8px;
  background: #eadac0;
  font-size: 11px;
}

.youtube { background: #b52424; }

.toast {
  position: fixed;
  bottom: 85px;
  right: 15px;
  left: 15px;
  padding: 15px;
  border-radius: 12px;
  background: var(--brown);
  color: white;
  text-align: center;
  z-index: 10;
}

@media (min-width: 650px) {
  .grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
</style>
</head>

<body>

<header>
  <div style="font-size:38px">♨</div>
  <h1>السيدة رزقي</h1>
  <p>وصفات من القلب · نكهات جزائرية</p>
</header>

<main id="main">
  <p class="empty">جارٍ الاتصال بقاعدة البيانات...</p>
</main>

<nav id="nav"></nav>

<script>
window.addEventListener("error", function (event) {
  var box = document.createElement("div");
  box.className = "error";
  box.textContent = "خطأ بالواجهة: " + event.message;
  document.body.appendChild(box);
});
</script>

<script>
"use strict";

/* إعدادات المشروع العامة، وليست مفاتيح إدارية سرية */
const SUPABASE_URL =
  "https://vyiywiteeqkyuroqftkn.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_4kzJ5yc7xLUPXBYoe2V0iQ_YyKEDiDp";

const ADMIN_UID =
  "e33bc325-89f7-49ab-afdb-17794b06fc7d";

const NL = String.fromCharCode(10);

let recipes = [];
let page = "home";
let selected = null;
let category = "الكل";
let query = "";
let loading = false;
let loadError = "";
let refreshPromise = null;
let editId = null;

function $(selector) {
  return document.querySelector(selector);
}

function esc(value) {
  return String(value == null ? "" : value)
    .replace(/[&<>"']/g, function (character) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character];
    });
}

function readLocal(key, fallback) {
  try {
    const value = JSON.parse(localStorage.getItem(key));
    return value == null ? fallback : value;
  } catch (error) {
    return fallback;
  }
}

/* الجلسة في الذاكرة فقط:
   يلزم تسجيل الدخول مجددًا بعد إعادة تشغيل التطبيق */
let session = null;

let favorites = readLocal("rozqi-cloud-favorites", []);

if (!Array.isArray(favorites)) favorites = [];

favorites = favorites.filter(function (id) {
  return typeof id === "string";
});

function isAdmin() {
  return Boolean(
    session &&
    session.user &&
    session.user.id === ADMIN_UID
  );
}

function toast(message) {
  const box = document.createElement("div");
  box.className = "toast";
  box.textContent = message;
  document.body.appendChild(box);

  setTimeout(function () {
    box.remove();
  }, 3000);
}

function saveFavorites() {
  try {
    localStorage.setItem(
      "rozqi-cloud-favorites",
      JSON.stringify(favorites)
    );
  } catch (error) {
    toast("تعذر حفظ المفضلة على الجهاز");
  }
}

function safeHttps(value) {
  if (!value) return "";

  try {
    const url = new URL(value);
    if (url.protocol !== "https:") return "";
    if (url.username || url.password) return "";
    return url.href;
  } catch (error) {
    return "";
  }
}

function youtubeUrl(value) {
  const clean = safeHttps(value);
  if (!clean) return "";

  const url = new URL(clean);

  const allowed = [
    "youtube.com",
    "www.youtube.com",
    "m.youtube.com",
    "youtu.be",
    "www.youtube-nocookie.com"
  ];

  return allowed.includes(url.hostname.toLowerCase()) ?
    clean : "";
}

async function rawRequest(path, options) {
  const settings = options || {};
  const controller = new AbortController();

  const timer = setTimeout(function () {
    controller.abort();
  }, 25000);

  try {
    const response = await fetch(SUPABASE_URL + path, {
      method: settings.method || "GET",
      headers: Object.assign({
        "apikey": SUPABASE_KEY,
        "Content-Type": "application/json"
      }, settings.headers || {}),
      body: settings.body === undefined ?
        undefined : JSON.stringify(settings.body),
      signal: controller.signal
    });

    const text = await response.text();
    let data = null;

    if (text) {
      try {
        data = JSON.parse(text);
      } catch (error) {
        data = { message: text };
      }
    }

    if (!response.ok) {
      const message = data && (
        data.msg ||
        data.message ||
        data.error_description ||
        data.error
      );

      const failure = new Error(
        message || "فشل الطلب: " + response.status
      );

      failure.status = response.status;
      throw failure;
    }

    return data;

  } catch (error) {
    if (error.name === "AbortError") {
      throw new Error("انتهت مهلة الاتصال. تحققي من الإنترنت.");
    }

    if (error instanceof TypeError) {
      throw new Error(
        "تعذر الاتصال. تحققي من الإنترنت وإعدادات التطبيق."
      );
    }

    throw error;

  } finally {
    clearTimeout(timer);
  }
}

function setSession(data) {
  session = {
    access_token: data.access_token,
    refresh_token: data.refresh_token,
    expires_at:
      data.expires_at ||
      Math.floor(Date.now() / 1000) + data.expires_in,
    user: data.user || (session && session.user)
  };
}

async function refreshSession() {
  if (!session) return;

  if (!refreshPromise) {
    const token = session.refresh_token;

    refreshPromise = rawRequest(
      "/auth/v1/token?grant_type=refresh_token",
      {
        method: "POST",
        body: { refresh_token: token }
      }
    ).then(function (data) {
      setSession(data);
    }).catch(function (error) {
      if (error.status === 400 || error.status === 401) {
        session = null;
      }
      throw error;
    }).finally(function () {
      refreshPromise = null;
    });
  }

  return refreshPromise;
}

async function api(path, options) {
  const settings = options || {};

  if (
    session &&
    session.expires_at <= Math.floor(Date.now() / 1000) + 60
  ) {
    await refreshSession();
  }

  function request() {
    const headers = Object.assign({}, settings.headers || {});

    if (session) {
      headers.Authorization = "Bearer " + session.access_token;
    }

    return rawRequest(path, {
      method: settings.method,
      body: settings.body,
      headers: headers
    });
  }

  try {
    return await request();
  } catch (error) {
    if (error.status === 401 && session) {
      await refreshSession();
      return request();
    }
    throw error;
  }
}

function renderNav() {
  const tabs = [
    ["home", "⌂ الرئيسية"],
    ["favorites", "♡ المفضلة"],
    ["admin", "⚙ الإدارة"]
  ];

  $("#nav").innerHTML = tabs.map(function (tab) {
    return `
      <button
        data-go="${tab[0]}"
        class="${page === tab[0] ? "active" : ""}">
        ${tab[1]}
      </button>
    `;
  }).join("");
}

function go(destination) {
  page = destination;
  category = "الكل";
  query = "";
  render();
  window.scrollTo(0, 0);
}

window.appBack = function () {
  if (page === "edit") {
    go("admin");
  } else if (page !== "home") {
    go("home");
  } else {
    toast("للخروج استخدمي زر الشاشة الرئيسية في الهاتف");
  }
};

async function loadRecipes() {
  if (loading) return;

  loading = true;
  loadError = "";
  render();

  try {
    let path =
      "/rest/v1/recipes?select=*" +
      "&order=featured.desc,created_at.desc" +
      "&limit=500";

    if (!isAdmin()) {
      path += "&published=eq.true";
    }

    const data = await api(path);

    if (!Array.isArray(data)) {
      throw new Error("استجابة غير متوقعة من قاعدة البيانات");
    }

    recipes = data;

  } catch (error) {
    loadError = error.message;

  } finally {
    loading = false;
    render();
  }
}

function recipeArt(recipe, detail) {
  const image = safeHttps(recipe.image_url);

  return `
    <div class="art ${detail ? "detail-art" : ""}">
      ${image ?
        `<img
          src="${esc(image)}"
          alt="${esc(recipe.name)}"
          loading="lazy"
          referrerpolicy="no-referrer">` :
        esc(recipe.emoji || "🍽️")}
    </div>
  `;
}

function cards(items) {
  if (!items.length) {
    return '<p class="empty">لا توجد وصفات هنا بعد.</p>';
  }

  return '<div class="grid">' + items.map(function (recipe) {
    return `
      <article class="card">
        <button
          class="heart"
          data-heart="${esc(recipe.id)}"
          aria-label="المفضلة">
          ${favorites.includes(recipe.id) ? "♥" : "♡"}
        </button>

        <div data-open="${esc(recipe.id)}" role="button" tabindex="0">
          ${recipeArt(recipe, false)}
          <div class="info">
            <h3>${esc(recipe.name)}</h3>
            <div class="small">
              ${esc(recipe.time)} دقيقة ·
              ${esc(recipe.servings)} أشخاص
            </div>
          </div>
        </div>
      </article>
    `;
  }).join("") + "</div>";
}

function updateList() {
  const items = recipes.filter(function (recipe) {
    return recipe.published &&
      (page !== "favorites" || favorites.includes(recipe.id)) &&
      (category === "الكل" || recipe.category === category) &&
      recipe.name.includes(query);
  });

  const results = $("#results");
  if (results) results.innerHTML = cards(items);
}

function renderHome() {
  const categories = ["الكل"];

  recipes.filter(function (recipe) {
    return recipe.published;
  }).forEach(function (recipe) {
    if (!categories.includes(recipe.category)) {
      categories.push(recipe.category);
    }
  });

  $("#main").innerHTML = `
    ${page === "home" ? `
      <section class="hero">
        <h2>كل وصفة حكاية لذيذة</h2>
        <p>وصفات السيدة رزقي المنشورة</p>
      </section>
    ` : "<h2>المفضلة على هذا الجهاز</h2>"}

    <button data-reload="1" ${loading ? "disabled" : ""}>
      ${loading ? "جارٍ التحميل..." : "↻ تحديث الوصفات"}
    </button>

    ${loadError ? `
      <p class="error">${esc(loadError)}</p>
    ` : ""}

    <input id="search" placeholder="ابحثي عن وصفة..." aria-label="بحث">

    <div class="chips">
      ${categories.map(function (item) {
        return `
          <button
            data-cat="${esc(item)}"
            class="${category === item ? "chosen" : ""}">
            ${esc(item)}
          </button>
        `;
      }).join("")}
    </div>

    <section id="results"></section>

    ${!loading && !loadError && !recipes.length ? `
      <p class="small">
        قاعدة الوصفات فارغة.
        سجّلي دخول الإدارة لإضافة أول وصفة.
      </p>
    ` : ""}
  `;

  updateList();

  $("#search").value = query;

  $("#search").oninput = function (event) {
    query = event.target.value.trim();
    updateList();
  };
}

function renderDetail() {
  const recipe = recipes.find(function (item) {
    return item.id === selected;
  });

  if (!recipe) {
    go("home");
    return;
  }

  const video = youtubeUrl(recipe.youtube_url);

  $("#main").innerHTML = `
    <button data-go="home">← الرئيسية</button>

    <section class="panel">
      ${recipeArt(recipe, true)}
      <h2>${esc(recipe.name)}</h2>

      <p class="small">
        ${esc(recipe.category)} ·
        ${esc(recipe.time)} دقيقة ·
        ${esc(recipe.servings)} أشخاص
      </p>

      <p style="white-space:pre-wrap">${esc(recipe.description)}</p>

      <div class="row">
        <button data-heart="${esc(recipe.id)}">
          ${favorites.includes(recipe.id) ? "♥ محفوظة" : "♡ حفظ"}
        </button>

        ${video ? `
          <a class="button youtube" href="${esc(video)}">
            ▶ مشاهدة فيديو يوتيوب
          </a>
        ` : ""}
      </div>
    </section>

    <section class="panel">
      <h3>المكونات</h3>
      <ul>
        ${(recipe.ingredients || []).map(function (text) {
          return "<li>" + esc(text) + "</li>";
        }).join("")}
      </ul>
    </section>

    <section class="panel">
      <h3>طريقة التحضير</h3>
      <ol>
        ${(recipe.steps || []).map(function (text) {
          return "<li>" + esc(text) + "</li>";
        }).join("")}
      </ol>
    </section>
  `;
}

function renderLogin() {
  $("#main").innerHTML = `
    <h2>دخول الإدارة</h2>

    <p class="small">
      استخدمي البريد وكلمة المرور اللذين أنشأتهما
      في Supabase Authentication.
    </p>

    <form id="loginForm" class="panel">
      <label>
        البريد الإلكتروني
        <input
          name="email"
          type="email"
          autocomplete="username"
          required
          dir="ltr">
      </label>

      <label>
        كلمة المرور
        <input
          name="password"
          type="password"
          autocomplete="current-password"
          required>
      </label>

      <button id="loginButton" type="submit">تسجيل الدخول</button>
      <p id="loginError" class="error" hidden></p>
    </form>
  `;

  $("#loginForm").onsubmit = async function (event) {
    event.preventDefault();

    const form = event.target;
    const button = $("#loginButton");
    const errorBox = $("#loginError");

    button.disabled = true;
    errorBox.hidden = true;

    try {
      const data = await rawRequest(
        "/auth/v1/token?grant_type=password",
        {
          method: "POST",
          body: {
            email: form.elements.email.value.trim(),
            password: form.elements.password.value
          }
        }
      );

      setSession(data);
      form.reset();

      if (!isAdmin()) {
        const token = session.access_token;
        session = null;

        rawRequest("/auth/v1/logout", {
          method: "POST",
          headers: {
            Authorization: "Bearer " + token
          }
        }).catch(function () {});

        throw new Error("هذا الحساب غير مخوّل بإدارة الوصفات.");
      }

      toast("تم تسجيل دخول الإدارة");
      await loadRecipes();

    } catch (error) {
      if ($("#loginError")) {
        $("#loginError").textContent = error.message;
        $("#loginError").hidden = false;
      }
    } finally {
      if ($("#loginButton")) {
        $("#loginButton").disabled = false;
      }
    }
  };
}

function renderAdmin() {
  if (!isAdmin()) {
    renderLogin();
    return;
  }

  $("#main").innerHTML = `
    <h2>إدارة الوصفات</h2>

    <p class="small">
      ${esc(session.user.email)}
      · الوصفات المحمّلة: ${recipes.length}
    </p>

    <div class="row">
      <button data-new="1">+ وصفة جديدة</button>
      <button data-reload="1" ${loading ? "disabled" : ""}>
        ${loading ? "تحميل..." : "تحديث"}
      </button>
      <button id="logout">خروج</button>
    </div>

    ${loadError ? `<p class="error">${esc(loadError)}</p>` : ""}

    <section class="panel">
      ${recipes.length ? recipes.map(function (recipe) {
        return `
          <div style="margin-bottom:18px">
            <h3>${esc(recipe.name)}</h3>
            <p>
              <span class="badge">
                ${recipe.published ? "منشورة" : "مسودة"}
              </span>
              ${recipe.featured ?
                '<span class="badge">مميزة</span>' : ""}
            </p>
            <div class="row">
              <button data-open="${esc(recipe.id)}">عرض</button>
              <button data-edit="${esc(recipe.id)}">تعديل</button>
              <button data-delete="${esc(recipe.id)}">حذف</button>
            </div>
          </div>
        `;
      }).join("") : `
        <p>لا توجد وصفات. اضغطي «وصفة جديدة» للبدء.</p>
      `}
    </section>

    <p class="small">
      الرفع المباشر للصور غير مضاف بعد.
      استخدمي رابط HTTPS مباشرًا لصورة.
      الجلسة لا تُحفظ بعد إغلاق التطبيق.
    </p>
  `;

  $("#logout").onclick = async function () {
    const old = session;
    session = null;
    recipes = [];
    go("home");

    if (old) {
      try {
        await rawRequest("/auth/v1/logout", {
          method: "POST",
          headers: {
            Authorization: "Bearer " + old.access_token
          }
        });
      } catch (error) {
        toast("تم الخروج محليًا، وتعذر إبطال الجلسة على الخادم.");
      }
    }

    await loadRecipes();
  };
}

function showEditor(id) {
  if (!isAdmin()) {
    go("admin");
    return;
  }

  editId = id;

  const recipe = recipes.find(function (item) {
    return item.id === id;
  }) || {
    name: "",
    category: "أطباق تقليدية",
    description: "",
    emoji: "🍽️",
    image_url: "",
    youtube_url: "",
    time: 30,
    servings: 4,
    ingredients: [],
    steps: [],
    featured: false,
    published: false
  };

  page = "edit";
  renderNav();

  $("#main").innerHTML = `
    <h2>${id ? "تعديل الوصفة" : "وصفة جديدة"}</h2>

    <form id="recipeForm" class="panel">
      <label>
        اسم الوصفة
        <input name="name" maxlength="150" required
          value="${esc(recipe.name)}">
      </label>

      <label>
        التصنيف
        <input name="category" maxlength="80" required
          value="${esc(recipe.category)}">
      </label>

      <label>
        وصف مختصر
        <textarea name="description" maxlength="3000">${esc(
          recipe.description
        )}</textarea>
      </label>

      <label>
        رمز الطبق
        <input name="emoji" maxlength="12"
          value="${esc(recipe.emoji)}">
      </label>

      <label>
        رابط صورة الطبق
        <input name="image_url" type="url" dir="ltr"
          placeholder="https://example.com/recipe.jpg"
          value="${esc(recipe.image_url)}">
      </label>

      <label>
        رابط فيديو يوتيوب
        <input name="youtube_url" type="url" dir="ltr"
          placeholder="https://www.youtube.com/watch?v=..."
          value="${esc(recipe.youtube_url)}">
      </label>

      <label>
        المدة بالدقائق
        <input name="time" type="number" min="1" max="1440"
          required value="${esc(recipe.time)}">
      </label>

      <label>
        عدد الأشخاص
        <input name="servings" type="number" min="1" max="100"
          required value="${esc(recipe.servings)}">
      </label>

      <label>
        المكونات: كل مكوّن في سطر
        <textarea name="ingredients" required>${esc(
          (recipe.ingredients || []).join(NL)
        )}</textarea>
      </label>

      <label>
        طريقة التحضير: كل خطوة في سطر
        <textarea name="steps" required>${esc(
          (recipe.steps || []).join(NL)
        )}</textarea>
      </label>

      <label>
        <input name="featured" type="checkbox"
          ${recipe.featured ? "checked" : ""}>
        وصفة مميزة
      </label>

      <label>
        <input name="published" type="checkbox"
          ${recipe.published ? "checked" : ""}>
        نشر الوصفة للجميع
      </label>

      <p class="small">
        إذا لم تفعّلي النشر، تُحفظ الوصفة كمسودة للأدمن فقط.
      </p>

      <p id="formError" class="error" hidden></p>

      <div class="row">
        <button id="saveButton" type="submit">حفظ الوصفة</button>
        <button id="cancelEdit" type="button">إلغاء</button>
      </div>
    </form>
  `;

  $("#cancelEdit").onclick = function () {
    go("admin");
  };

  $("#recipeForm").onsubmit = saveRecipe;
  window.scrollTo(0, 0);
}

async function saveRecipe(event) {
  event.preventDefault();

  if (!isAdmin()) {
    go("admin");
    return;
  }

  const form = event.target;
  const id = editId;
  const button = $("#saveButton");
  const cancel = $("#cancelEdit");
  const errorBox = $("#formError");

  function value(name) {
    return form.elements.namedItem(name).value.trim();
  }

  function lines(name) {
    return value(name).split(NL).map(function (text) {
      return text.trim();
    }).filter(Boolean);
  }

  const image = value("image_url");
  const video = value("youtube_url");

  const recipe = {
    name: value("name"),
    category: value("category"),
    description: value("description"),
    emoji: value("emoji") || "🍽️",
    image_url: image ? safeHttps(image) : "",
    youtube_url: video ? youtubeUrl(video) : "",
    time: Number(value("time")),
    servings: Number(value("servings")),
    ingredients: lines("ingredients"),
    steps: lines("steps"),
    featured: form.elements.featured.checked,
    published: form.elements.published.checked
  };

  errorBox.hidden = true;

  try {
    if (!recipe.name || !recipe.category) {
      throw new Error("اكتبي اسم الوصفة والتصنيف.");
    }

    if (!recipe.ingredients.length || !recipe.steps.length) {
      throw new Error("أضيفي المكونات وخطوات التحضير.");
    }

    if (
      !Number.isInteger(recipe.time) ||
      recipe.time < 1 || recipe.time > 1440 ||
      !Number.isInteger(recipe.servings) ||
      recipe.servings < 1 || recipe.servings > 100
    ) {
      throw new Error("تحققي من المدة وعدد الأشخاص.");
    }

    if (image && !recipe.image_url) {
      throw new Error("رابط الصورة يجب أن يكون HTTPS صالحًا.");
    }

    if (video && !recipe.youtube_url) {
      throw new Error("استخدمي رابط HTTPS من يوتيوب.");
    }

    button.disabled = true;
    cancel.disabled = true;
    button.textContent = "جارٍ الحفظ...";

    const path = id ?
      "/rest/v1/recipes?id=eq." + encodeURIComponent(id) :
      "/rest/v1/recipes";

    const saved = await api(path, {
      method: id ? "PATCH" : "POST",
      headers: {
        "Prefer": "return=representation"
      },
      body: recipe
    });

    if (!Array.isArray(saved) || saved.length !== 1) {
      throw new Error(
        "لم يتم تأكيد الحفظ. تحققي من حساب الإدارة والصلاحيات."
      );
    }

    const row = saved[0];
    const index = recipes.findIndex(function (item) {
      return item.id === row.id;
    });

    if (index >= 0) {
      recipes[index] = row;
    } else {
      recipes.unshift(row);
    }

    go("admin");
    toast("حُفظت الوصفة في Supabase");

  } catch (error) {
    errorBox.textContent = error.message;
    errorBox.hidden = false;
    button.disabled = false;
    cancel.disabled = false;
    button.textContent = "حفظ الوصفة";
  }
}

async function deleteRecipe(id, button) {
  if (!isAdmin()) return;
  if (!window.confirm("حذف الوصفة نهائيًا من قاعدة البيانات؟")) {
    return;
  }

  button.disabled = true;

  try {
    const removed = await api(
      "/rest/v1/recipes?id=eq." + encodeURIComponent(id),
      {
        method: "DELETE",
        headers: {
          "Prefer": "return=representation"
        }
      }
    );

    if (!Array.isArray(removed) || removed.length !== 1) {
      throw new Error("لم يتم تأكيد الحذف. تحققي من الصلاحيات.");
    }

    recipes = recipes.filter(function (recipe) {
      return recipe.id !== id;
    });

    favorites = favorites.filter(function (item) {
      return item !== id;
    });

    saveFavorites();
    render();
    toast("تم حذف الوصفة");

  } catch (error) {
    toast(error.message);
    button.disabled = false;
  }
}

function render() {
  /* لا نمسح نموذجًا قيد الكتابة عند انتهاء تحميل بالخلفية */
  if (page === "edit") return;

  renderNav();

  if (page === "home" || page === "favorites") {
    renderHome();
  } else if (page === "detail") {
    renderDetail();
  } else if (page === "admin") {
    renderAdmin();
  }
}

document.addEventListener("click", function (event) {
  const button = event.target.closest(
    "[data-go], [data-open], [data-heart], [data-cat], " +
    "[data-reload], [data-new], [data-edit], [data-delete]"
  );

  if (!button || button.disabled) return;

  const data = button.dataset;

  if (data.go) {
    go(data.go);

  } else if (data.open) {
    selected = data.open;
    page = "detail";
    render();
    window.scrollTo(0, 0);

  } else if (data.heart) {
    if (favorites.includes(data.heart)) {
      favorites = favorites.filter(function (id) {
        return id !== data.heart;
      });
    } else {
      favorites.push(data.heart);
    }

    saveFavorites();

    if (page === "home" || page === "favorites") {
      updateList();
    } else {
      render();
    }

  } else if (data.cat) {
    category = data.cat;

    document.querySelectorAll("[data-cat]").forEach(function (item) {
      item.classList.toggle(
        "chosen",
        item.dataset.cat === category
      );
    });

    updateList();

  } else if (data.reload) {
    loadRecipes();

  } else if (data.new) {
    showEditor(null);

  } else if (data.edit) {
    showEditor(data.edit);

  } else if (data.delete) {
    deleteRecipe(data.delete, button);
  }
});

document.addEventListener("error", function (event) {
  const image = event.target;

  if (image.tagName === "IMG") {
    const parent = image.parentElement;
    image.remove();
    parent.textContent = "🍽️";
  }
}, true);

render();
loadRecipes();
</script>

</body>
</html>
